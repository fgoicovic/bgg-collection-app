<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <ul style="display: flex; gap: 18px; list-style: none; margin: 0; padding: 0; justify-content: center;">
                <li>
                    <a href="{{ url_for('index') }}" class="nav-link-btn">Home</a>
                </li>
                <li>
                    <a href="{{ url_for('fetch_collection') }}" class="nav-link-btn">Fetch Collection</a>
                </li>
                <li>
                    <a href="{{ url_for('compare_lists') }}" class="nav-link-btn">Compare Game Lists</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
